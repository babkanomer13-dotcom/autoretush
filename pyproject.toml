[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autoretush"
version = "0.1.0"
description = "Local-first tooling for building paired photo-retouching datasets"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pyyaml>=6.0,<7",
  "scipy>=1.14,<2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
autoretush = "autoretush.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autoretush"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/autoretush/review.py" = ["E501"]
